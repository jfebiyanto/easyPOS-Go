services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: easypos
      POSTGRES_PASSWORD: easypos
      POSTGRES_DB: easypos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easypos"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
