<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>easyPOS</title>
<style>
:root{--primary:#0F6E63;--primary-hover:#0B5A51;--bg:#FBFBFA;--surface:#fff;--outline:#D6D6D0;--text:#1B1F23;--muted:#5A6472;--danger:#B3261E;--danger-bg:#F9DEDC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/20px Inter,system-ui,sans-serif}
main{width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:24px}
h1{font-size:24px;line-height:32px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:500;font-size:13px;margin:12px 0 4px}
input{width:100%;height:40px;padding:0 12px;border:1px solid var(--outline);border-radius:6px;font:inherit}
input:focus{outline:3px solid rgba(15,110,99,.35);border-color:var(--primary)}
button{width:100%;height:44px;margin-top:20px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
button:hover{background:var(--primary-hover)}
#err{display:none;margin-top:12px;padding:8px 12px;border-radius:6px;background:var(--danger-bg);color:var(--danger)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:16px 0 0}dt{color:var(--muted)}dd{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>easyPOS</h1>
<section id="login">
<p>Masuk dengan akun yang diberikan Owner.</p>
<form id="f">
<label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<button type="submit">Masuk</button>
<div id="err" role="alert"></div>
</form>
</section>
<section id="home" hidden>
<p>Anda sudah masuk.</p>
<dl><dt>Nama</dt><dd id="n"></dd><dt>Role</dt><dd id="r"></dd></dl>
<button id="out" type="button">Keluar</button>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
function show(u){$('#login').hidden=!!u;$('#home').hidden=!u;if(u){$('#n').textContent=u.name;$('#r').textContent=u.role}}
fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(show);
$('#f').addEventListener('submit',async e=>{e.preventDefault();$('#err').style.display='none';
const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});
const j=await r.json();if(r.ok){$('#p').value='';show(j)}else{$('#err').textContent=j.error||'Gagal masuk';$('#err').style.display='block'}});
$('#out').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST'});show(null)});
</script>
</body>
</html>
