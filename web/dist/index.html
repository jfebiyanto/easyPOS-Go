<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>easyPOS</title>
<style>
:root{--primary:#1E3A5F;--primary-hover:#152B47;--primary-c:#D6E2F3;--on-primary-c:#0B1F3A;--bg:#FBFBFA;--surface:#fff;--surface2:#F1F1EE;--outline:#D6D6D0;--outline-strong:#9AA1A9;--text:#1B1F23;--muted:#5A6472;--danger:#B3261E;--danger-bg:#F9DEDC;--ok:#0B1F3A;--ok-bg:#D6E2F3;--warn:#B45309;--warn-bg:#FCE7C8;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/20px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.num{font-family:var(--mono);font-feature-settings:"tnum" 1,"zero" 1;text-align:right;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{height:36px;padding:0 14px;border:1px solid var(--outline);border-radius:8px;background:var(--surface);color:var(--text);font-weight:500}
.btn:hover{border-color:var(--outline-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{height:48px;font-size:16px;font-weight:600}
input,select{height:36px;padding:0 10px;border:1px solid var(--outline);border-radius:6px;font:inherit;background:var(--surface);color:var(--text);max-width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid rgba(30,58,95,.35);border-color:var(--primary)}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
[hidden]{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:20px}
.login{width:min(380px,100%)}
.login h1{font-size:24px;line-height:32px;margin:0 0 4px}.login input{width:100%}.login .btn{width:100%;margin-top:18px;height:44px}
.muted{color:var(--muted)}
.err{margin-top:12px;padding:8px 12px;border-radius:6px;background:var(--danger-bg);color:var(--danger)}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--outline);flex-wrap:wrap}
header.top b{font-size:16px}.spacer{flex:1}
.tabs{display:flex;gap:4px}.tab{border:0;background:none;height:36px;padding:0 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.tab[aria-selected=true]{background:var(--primary-c);color:var(--on-primary-c)}
.pill{padding:2px 10px;border-radius:999px;background:var(--surface2);font-size:12px}
main.page{padding:16px;max-width:1200px;margin:0 auto}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th{background:var(--surface2);text-align:left;font-size:13px;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--outline)}
td{padding:8px 10px;border-bottom:1px solid var(--outline)}
th.num,td.num{text-align:right}
.toolbar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:14px}.kpi small{color:var(--muted)}.kpi div{font:600 24px/32px var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.badge{padding:1px 8px;border-radius:999px;font-size:12px;background:var(--ok-bg);color:var(--ok)}.badge.off{background:var(--surface2);color:var(--muted)}.badge.low{background:var(--warn-bg);color:var(--warn)}
dialog{border:1px solid var(--outline);border-radius:12px;padding:20px;max-width:min(520px,calc(100vw - 24px));width:100%;box-shadow:0 12px 24px -6px rgba(16,24,40,.14)}
dialog::backdrop{background:rgba(16,24,40,.35)}
dialog h2{margin:0 0 8px;font-size:20px;line-height:28px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;height:calc(100vh - 57px - 44px)}
@media(max-width:900px){.pos{grid-template-columns:1fr;height:auto}}
.pos .left{display:flex;flex-direction:column;min-height:0;gap:8px}
.scan{height:48px;font-size:18px;border:2px solid #0B0F14;border-radius:8px;padding:0 12px;width:100%}
.cartwrap{flex:1;min-height:200px;overflow:auto;border:2px solid #0B0F14;border-radius:8px;background:var(--surface)}
.cartwrap tr.sel td{background:var(--primary-c)}
.results{max-height:180px;overflow:auto;border:1px solid var(--outline);border-radius:8px;background:var(--surface)}
.results button{display:flex;width:100%;border:0;border-bottom:1px solid var(--outline);background:none;padding:8px 10px;text-align:left;gap:8px}
.results button:hover{background:var(--surface2)}.results .name{flex:1}
.pos .right{display:flex;flex-direction:column;gap:8px}
.total{font:700 40px/48px var(--mono);text-align:right;padding:8px 12px;border:2px solid #0B0F14;border-radius:8px;background:var(--surface)}
.sum{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px;background:var(--surface);border:1px solid var(--outline);border-radius:8px}
.fkeys{position:sticky;bottom:0;display:flex;gap:6px;padding:6px 12px;background:var(--surface2);border-top:1px solid var(--outline);flex-wrap:wrap}
.fkeys button{height:32px;padding:0 10px;border:1px solid var(--outline-strong);border-radius:6px;background:var(--surface);font-size:13px}
.fkeys b{font-family:var(--mono);color:var(--primary)}
.qty{display:inline-flex;gap:4px;align-items:center}.qty button{width:26px;height:26px;border:1px solid var(--outline);border-radius:6px;background:var(--surface)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:#0B0F14;color:#fff;z-index:60}
.toast.bad{background:var(--danger)}
#receipt{display:none}
@media print{body>*:not(#receipt){display:none!important}#receipt{display:block;width:72mm;margin:0;font:12px/16px var(--mono);color:#000}#receipt table{background:none}#receipt td,#receipt th{border:0;padding:1px 0;background:none}}
</style>
</head>
<body>
<div id="login-view" class="center" hidden>
  <form id="login-form" class="card login">
    <h1>easyPOS</h1><p class="muted" style="margin:0 0 8px">Masuk dengan akun yang diberikan Owner.</p>
    <label for="lu">Username</label><input id="lu" autocomplete="username" required autofocus>
    <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Masuk</button>
    <div id="lerr" class="err" role="alert" hidden></div>
  </form>
</div>
<div id="app" hidden>
  <header class="top">
    <b>easyPOS</b><span class="pill" id="who"></span>
    <nav class="tabs" id="nav" aria-label="Menu"></nav>
    <span class="spacer"></span><span class="muted" id="clock"></span>
    <button class="btn" id="logout" type="button">Keluar</button>
  </header>
  <div id="view"></div>
</div>
<div id="receipt"></div>
<dialog id="dlg"></dialog>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=v=>'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(v||0));
const nf=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:4}).format(Number(v||0));
async function api(path,opt={}){
  const r=await fetch('/api'+path,{method:opt.method||'GET',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined});
  let j=null;try{j=await r.json()}catch{}
  if(r.status===401&&!path.startsWith('/auth/login')){showLogin();throw new Error('Sesi berakhir')}
  if(!r.ok)throw new Error((j&&j.error)||'Terjadi kesalahan ('+r.status+')');
  return j;
}
function toast(msg,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2800)}
const dlg=$('#dlg');
function openDlg(html){dlg.innerHTML=html;if(!dlg.open)dlg.showModal();return dlg}
function closeDlg(){if(dlg.open)dlg.close();dlg.innerHTML=''}
dlg.addEventListener('cancel',()=>{dlg.innerHTML=''});

let me=null,cfg=null,screen='pos';
let posKeys=null;
async function boot(){
  try{me=await api('/auth/me');startApp()}catch{showLogin()}
}
function showLogin(){me=null;$('#app').hidden=true;$('#login-view').hidden=false;closeDlg();detachPos()}
$('#login-form').addEventListener('submit',async e=>{
  e.preventDefault();$('#lerr').hidden=true;
  try{me=await api('/auth/login',{method:'POST',body:{username:$('#lu').value,password:$('#lp').value}});$('#lp').value='';startApp()}
  catch(x){$('#lerr').textContent=x.message;$('#lerr').hidden=false}
});
$('#logout').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST'});showLogin()});
const roleName={owner:'Owner',store_manager:'Store Manager',cashier:'Kasir'};
function startApp(){
  $('#login-view').hidden=true;$('#app').hidden=false;
  $('#who').textContent=me.name+' · '+roleName[me.role];
  const tabs=[];
  if(me.role!=='owner')tabs.push(['pos','Kasir (POS)']);
  if(me.role!=='cashier')tabs.push(['products','Produk'],['stock','Stok'],['customers','Pelanggan'],['report','Laporan']);
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="tab" role="tab" data-k="${k}">${l}</button>`).join('');
  $('#nav').onclick=e=>{const k=e.target.dataset.k;if(k)go(k)};
  go(tabs[0][0]);
}
function go(k){
  screen=k;detachPos();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k));
  ({pos:renderPOS,products:renderProducts,stock:renderStock,customers:renderCustomers,report:renderReport})[k]();
}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'})},1000);

/* ---------- POS ---------- */
let cart=[],sel=0,products=[],payTypes=[],busy=false,customer=null;
function detachPos(){if(posKeys){document.removeEventListener('keydown',posKeys);posKeys=null}}
async function renderPOS(){
  cfg=await api('/pos/config');payTypes=await api('/pos/payment-types');
  $('#view').innerHTML=`
  <div class="pos">
    <section class="left">
      <input class="scan" id="scan" placeholder="Scan barcode atau ketik SKU / nama produk, lalu Enter" autocomplete="off" aria-label="Scan atau cari produk">
      <div class="results" id="results" hidden></div>
      <div class="cartwrap"><table><thead><tr><th>Kode</th><th>Nama Barang</th><th class="num">Qty</th><th class="num">Harga</th><th class="num">Total</th></tr></thead><tbody id="cart"></tbody></table></div>
    </section>
    <aside class="right">
      <div class="card" style="padding:12px"><div class="muted">${esc(cfg.company)} · ${esc(cfg.store)}</div>
        <div id="custbox" style="margin-top:8px;display:flex;gap:8px;align-items:center"><div style="flex:1" id="custtxt"></div><button class="btn" id="custbtn" style="height:30px">F2</button></div></div>
      <div class="sum"><span>Item</span><span class="num" id="s-items">0</span><span>Subtotal</span><span class="num" id="s-sub">${rp(0)}</span><span id="s-taxl">PPN</span><span class="num" id="s-tax">${rp(0)}</span></div>
      <div class="total" id="total" aria-live="polite">${rp(0)}</div>
      <button class="btn primary lg" id="pay">Bayar (F12)</button>
    </aside>
  </div>
  <div class="fkeys">
    <button data-f="F1"><b>F1</b> Retur</button><button data-f="F2"><b>F2</b> Pelanggan</button><button data-f="F3"><b>F3</b> Cari</button><button data-f="F5"><b>F5</b> Ubah Qty</button><button data-f="F6"><b>F6</b> Transaksi</button>
    <button data-f="F8"><b>F8</b> Hapus Item</button><button data-f="F9"><b>F9</b> Batal</button><button data-f="F11"><b>F11</b> Bayar Cepat</button><button data-f="F12"><b>F12</b> Bayar</button>
  </div>`;
  $('#scan').focus();
  $('#scan').addEventListener('keydown',onScan);
  $('#scan').addEventListener('input',debounce(searchLive,200));
  $('#pay').onclick=openPay;$('#custbtn').onclick=()=>fkey('F2');drawCustomer();
  document.querySelector('.fkeys').onclick=e=>{const f=e.target.closest('[data-f]');if(f)fkey(f.dataset.f)};
  posKeys=e=>{
    if(dlg.open)return;
    if(/^F(1|2|3|5|6|8|9|11|12)$/.test(e.key)){e.preventDefault();fkey(e.key)}
    else if(e.key==='ArrowDown'&&cart.length){sel=Math.min(sel+1,cart.length-1);drawCart()}
    else if(e.key==='ArrowUp'&&cart.length){sel=Math.max(sel-1,0);drawCart()}
    else if((e.key==='+'||e.key==='-')&&document.activeElement!==$('#scan')){chg(sel,e.key==='+'?1:-1)}
    else if(e.key==='Escape'){$('#scan').value='';$('#results').hidden=true;$('#scan').focus()}
  };
  document.addEventListener('keydown',posKeys);
  drawCart();
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
async function searchLive(){
  const q=$('#scan').value.trim(),box=$('#results');
  if(q.length<2){box.hidden=true;return}
  products=await api('/pos/products?q='+encodeURIComponent(q));
  box.hidden=!products.length;
  box.innerHTML=products.map((p,i)=>`<button data-i="${i}"><span class="num">${esc(p.sku)}</span><span class="name">${esc(p.name)}</span><span class="num">${rp(p.base_price)}</span><span class="badge ${Number(p.on_hand)<=0&&p.track_stock?'low':''}">${nf(p.on_hand)}</span></button>`).join('');
  box.onclick=e=>{const b=e.target.closest('button');if(b)add(products[b.dataset.i])};
}
async function onScan(e){
  if(e.key!=='Enter')return;e.preventDefault();
  const q=e.target.value.trim();if(!q)return;
  const list=await api('/pos/products?q='+encodeURIComponent(q));
  const exact=list.find(p=>p.barcode===q||p.sku.toLowerCase()===q.toLowerCase())||(list.length===1?list[0]:null);
  if(exact)add(exact);else if(!list.length)toast('Produk tidak ditemukan',true);else searchLive();
}
function add(p){
  const i=cart.findIndex(l=>l.p.id===p.id);
  if(i>=0){cart[i].qty+=1;sel=i}else{cart.push({p,qty:1});sel=cart.length-1}
  $('#scan').value='';$('#results').hidden=true;drawCart();$('#scan').focus();
}
function chg(i,d){if(!cart[i])return;cart[i].qty=Math.max(1,cart[i].qty+d);drawCart()}
function calc(){
  let gross=0,items=0;for(const l of cart){gross+=Number(l.p.base_price)*l.qty;items+=l.qty}
  const r=cfg.ppn_enabled?Number(cfg.ppn_rate):0;
  const tax=cfg.ppn_inclusive?gross*r/(100+r):gross*r/100;
  const rt=x=>Math.round(x*100)/100;
  return{items,sub:rt(gross),tax:rt(tax),total:cfg.ppn_inclusive?rt(gross):rt(gross)+rt(tax)};
}
function drawCart(){
  $('#cart').innerHTML=cart.length?cart.map((l,i)=>`<tr class="${i===sel?'sel':''}" data-i="${i}"><td class="num" style="text-align:left">${esc(l.p.sku)}</td><td>${esc(l.p.name)}</td>
    <td class="num"><span class="qty"><button data-d="-1" aria-label="Kurangi">−</button><span>${nf(l.qty)}</span><button data-d="1" aria-label="Tambah">+</button></span></td>
    <td class="num">${rp(l.p.base_price)}</td><td class="num">${rp(Number(l.p.base_price)*l.qty)}</td></tr>`).join(''):`<tr><td colspan="5" class="muted" style="text-align:center;padding:32px">Keranjang kosong. Scan atau cari produk untuk memulai.</td></tr>`;
  $('#cart').onclick=e=>{const tr=e.target.closest('tr[data-i]');if(!tr)return;sel=Number(tr.dataset.i);const d=e.target.closest('[data-d]');if(d)chg(sel,Number(d.dataset.d));else drawCart()};
  const c=calc();
  $('#s-items').textContent=nf(c.items);$('#s-sub').textContent=rp(c.sub);$('#s-tax').textContent=rp(c.tax);
  $('#s-taxl').textContent=cfg.ppn_enabled?`PPN ${nf(cfg.ppn_rate)}% (${cfg.ppn_inclusive?'termasuk':'ditambahkan'})`:'PPN (nonaktif)';
  $('#total').textContent=rp(c.total);$('#pay').disabled=!cart.length;
}
function fkey(k){
  if(k==='F1')openReturn();
  else if(k==='F2')openCustomer();
  else if(k==='F3'){$('#scan').focus();$('#scan').select()}
  else if(k==='F5'){if(!cart[sel])return;const v=prompt('Qty baru untuk '+cart[sel].p.name,cart[sel].qty);const n=Number(v);if(v!==null&&n>0){cart[sel].qty=n;drawCart()}}
  else if(k==='F6')showToday();
  else if(k==='F8'){if(cart[sel]&&confirm('Hapus '+cart[sel].p.name+' dari keranjang?')){cart.splice(sel,1);sel=Math.max(0,sel-1);drawCart()}}
  else if(k==='F9'){if(cart.length&&confirm('Batalkan transaksi dan kosongkan keranjang?')){cart=[];sel=0;customer=null;drawCustomer();drawCart()}}
  else if(k==='F11'){const c=payTypes.find(p=>p.is_cash);if(cart.length&&c)checkout([{payment_type_id:c.id,amount:String(calc().total)}])}
  else if(k==='F12')openPay();
}
function openPay(){
  if(!cart.length)return;const total=calc().total;
  let rows=[];
  const d=openDlg(`<h2>Pembayaran</h2><div class="total" style="font-size:32px">${rp(total)}</div>
    <div class="row" style="margin-top:12px"><select id="pt" aria-label="Metode">${payTypes.map(p=>`<option value="${p.id}" data-cash="${p.is_cash}">${esc(p.name)}</option>`).join('')}</select>
    <input id="pa" class="num" inputmode="decimal" aria-label="Nominal" value="${total}"><button class="btn" id="padd" type="button" style="flex:0 0 auto">Tambah</button></div>
    <div class="quick" id="quick"></div><table style="margin-top:12px"><tbody id="plist"></tbody></table>
    <div class="sum" style="margin-top:12px"><span>Dibayar</span><span class="num" id="p-paid">${rp(0)}</span><span id="p-lbl">Kurang</span><span class="num" id="p-rem">${rp(total)}</span></div>
    <div class="actions"><button class="btn" id="pcancel" type="button">Batal</button><button class="btn primary lg" id="pdone" type="button" disabled>Selesai</button></div>`);
  const paid=()=>rows.reduce((a,r)=>a+r.amount,0);
  const refresh=()=>{
    const p=paid(),rem=total-p;
    $('#plist',d).innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td class="num">${rp(r.amount)}</td><td style="width:40px"><button class="btn danger" data-x="${i}" style="height:28px;padding:0 8px">×</button></td></tr>`).join('');
    $('#p-paid',d).textContent=rp(p);$('#p-lbl',d).textContent=rem>0?'Kurang':'Kembalian';$('#p-rem',d).textContent=rp(Math.abs(rem));
    $('#pdone',d).disabled=rem>0;
    const left=Math.max(rem,0);$('#pa',d).value=left||'';
    const cash=!!(d.querySelector('#pt option:checked')||{}).dataset?.cash&&d.querySelector('#pt option:checked').dataset.cash==='true';
    $('#quick',d).innerHTML=cash&&left>0?[left,...[5000,10000,20000,50000,100000].filter(x=>x>left).slice(0,3)].map(v=>`<button class="btn" data-q="${v}">${v===left?'Uang pas':rp(v)}</button>`).join(''):'';
  };
  $('#quick',d).onclick=e=>{const q=e.target.dataset.q;if(q){$('#pa',d).value=q;addRow()}};
  const addRow=()=>{const a=Number($('#pa',d).value);if(!(a>0))return;const o=d.querySelector('#pt option:checked');rows.push({payment_type_id:o.value,name:o.textContent,amount:a});refresh()};
  $('#padd',d).onclick=addRow;
  $('#pt',d).onchange=refresh;
  $('#plist',d).onclick=e=>{const x=e.target.dataset.x;if(x!==undefined){rows.splice(x,1);refresh()}};
  $('#pcancel',d).onclick=closeDlg;
  $('#pa',d).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if($('#pa',d).value)addRow();else if(!$('#pdone',d).disabled)$('#pdone',d).click()}});
  $('#pdone',d).onclick=()=>checkout(rows.map(r=>({payment_type_id:r.payment_type_id,amount:String(r.amount)})));
  refresh();$('#pa',d).focus();$('#pa',d).select();
}
async function checkout(payments){
  if(busy)return;busy=true;
  try{
    const sale=await api('/pos/sales',{method:'POST',body:{client_uuid:crypto.randomUUID(),customer_id:customer?customer.id:'',lines:cart.map(l=>({product_id:l.p.id,qty:String(l.qty)})),payments}});
    cart=[];sel=0;customer=null;drawCustomer();drawCart();showReceipt(sale);
  }catch(x){toast(x.message,true);closeDlg()}finally{busy=false}
}
function receiptHTML(s){
  return `<div style="text-align:center"><b>${esc(cfg.company)}</b><br>${esc(cfg.store)}</div><hr>
  <div>${esc(s.number)}<br>${s.customer?'Pelanggan: '+esc(s.customer)+'<br>':''}${new Date(s.sold_at).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})}<br>Kasir: ${esc(s.cashier)}</div><hr>

function openReturn(){
  const uid=crypto.randomUUID();let lk=null;
  const d=openDlg(`<h2>Retur penjualan</h2><div class="row"><input id="rn" placeholder="Nomor struk, mis. INV-202611-000001" autocomplete="off"><button class="btn primary" id="rgo" style="flex:0 0 auto">Cari</button></div>
    <div class="err" id="re" hidden></div><div id="rbody"></div>
    <div class="actions"><button class="btn" id="rclose" type="button">Tutup</button></div>`);
  $('#rclose',d).onclick=closeDlg;$('#rn',d).focus();
  const err=m=>{$('#re',d).textContent=m;$('#re',d).hidden=!m};
  const find=async()=>{
    err('');$('#rbody',d).innerHTML='';
    try{lk=await api('/pos/returns/lookup?number='+encodeURIComponent($('#rn',d).value))}catch(x){return err(x.message)}
    $('#rbody',d).innerHTML=`<p class="muted" style="margin:12px 0 4px">${esc(lk.number)} · ${new Date(lk.sold_at).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})}${lk.customer?' · '+esc(lk.customer):''} · total ${rp(lk.total)}</p>
      <table><thead><tr><th>Barang</th><th class="num">Sisa</th><th class="num">Refund/unit</th><th class="num">Qty retur</th></tr></thead><tbody>
      ${lk.lines.map((l,i)=>`<tr><td>${esc(l.name)}</td><td class="num">${nf(l.returnable)}</td><td class="num">${rp(l.unit_refund)}</td><td class="num"><input data-i="${i}" class="num rq" inputmode="decimal" value="0" ${Number(l.returnable)<=0?'disabled':''} style="width:70px"></td></tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:8px"><input id="rr" placeholder="Alasan retur (wajib)"><select id="rm">${payTypes.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="sum" style="margin-top:8px"><span>Total refund</span><span class="num" id="rt">${rp(0)}</span></div>
      <div class="actions"><button class="btn primary" id="rsave" type="button" disabled>Proses retur</button></div>`;
    const upd=()=>{let t=0,any=false;d.querySelectorAll('.rq').forEach(i=>{const l=lk.lines[i.dataset.i],q=Number(i.value)||0;if(q>0)any=true;t+=q*Number(l.unit_refund)});$('#rt',d).textContent=rp(t);$('#rsave',d).disabled=!any};
    d.querySelectorAll('.rq').forEach(i=>i.addEventListener('input',upd));
    $('#rsave',d).onclick=async()=>{
      const lines=[...d.querySelectorAll('.rq')].filter(i=>Number(i.value)>0).map(i=>({line_id:lk.lines[i.dataset.i].line_id,qty:String(Number(i.value))}));
      try{
        const r=await api('/pos/returns',{method:'POST',body:{client_uuid:uid,sale_number:lk.number,reason:$('#rr',d).value,refund_payment_type_id:$('#rm',d).value,lines}});
        $('#rbody',d).innerHTML=`<div class="kpis" style="margin-top:12px;grid-template-columns:1fr 1fr"><div class="kpi"><small>Refund</small><div>${rp(r.total)}</div></div><div class="kpi"><small>Poin dikurangi</small><div>${r.points_deducted}</div></div></div><p class="muted">${esc(r.number)} untuk ${esc(r.sale_number)}. Stok sudah dikembalikan.</p>`;
        toast('Retur '+r.number+' diproses');
      }catch(x){err(x.message)}
    };
  };
  $('#rgo',d).onclick=find;$('#rn',d).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();find()}});
}
