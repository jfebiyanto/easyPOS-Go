<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../src/assets/easypos_logo_circle.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="../src/assets/easypos_logo_circle.png" sizes="256x256" />
    <title>easyPOS Kasir</title>
    <script>
      // Pasang tema sebelum render agar tidak berkedip. Logika sama dengan src/shared/theme.ts.
      (function () {
        try {
          var p = localStorage.getItem('easypos.theme');
          var d = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pos/main.tsx"></script>
  </body>
</html>
